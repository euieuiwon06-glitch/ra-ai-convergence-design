<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>자세 코치 알림</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "NotionInter", Inter, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .card {
    display: none;
    gap: 12px;
    align-items: flex-start;
    box-sizing: border-box;
    width: 356px;
    margin: 8px auto 0 auto;
    padding: 16px;
    background: #ffffff;
    border: 1px solid #e6e6e6;
    border-radius: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.08);
  }
  .card.visible { display: flex; }

  .icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #dd5b00;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    flex: none;
  }
  .card.notice .icon { background: #a39e98; }

  .body { flex: 1; min-width: 0; }
  .title {
    margin: 0 0 2px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.125px;
    color: rgba(0,0,0,0.95);
  }
  .subtitle {
    margin: 0;
    font-size: 13px;
    color: #615d59;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">!</div>
    <div class="body">
      <p class="title" id="title">자세 코치</p>
      <p class="subtitle" id="subtitle"></p>
    </div>
  </div>
<script src="alert.js"></script>
</body>
</html>
